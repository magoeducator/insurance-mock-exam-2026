<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f37021">
  <meta name="description" content="1형부터 20형까지 모집질서 관련 법규 80문항 집중학습">
  <title>모집질서 관련 법규 80문항 집중학습</title>
  
  <style>
    html.auth-pending body{visibility:hidden}
    :root{--orange:#f37021;--orange-dark:#d95810;--ink:#202124;--muted:#6b7280;--line:#e6e8eb;--soft:#fff7f1;--green:#16803c;--green-bg:#eaf8ef;--red:#c62828;--red-bg:#fff0f0;--navy:#243247}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#f5f6f8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
    body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
    button{font:inherit}
    button{border:0;cursor:pointer}
    button:disabled{cursor:default}
    .app{width:min(760px,100%);margin:0 auto;min-height:100vh;background:#fff;box-shadow:0 0 24px rgba(0,0,0,.06)}
    .site-header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 5px 18px rgba(32,43,60,.1)}
    .site-title-row{height:44px;display:flex;align-items:center;background:var(--orange);color:#fff;padding:0 max(14px,calc((100% - 760px)/2 + 14px));overflow:hidden}
    .site-title{width:100%;font-size:clamp(12px,3.6vw,16px);font-weight:900;letter-spacing:-.045em;line-height:1;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
    .site-title::-webkit-scrollbar,.top-menu::-webkit-scrollbar{display:none}
    .top-menu{height:48px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;overflow-x:auto;white-space:nowrap;background:#fff}
    .top-menu-link{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:0 14px;border:1px solid #ffd0b5;border-radius:999px;color:var(--orange-dark);font-size:13px;font-weight:900;text-align:center;background:#fff8f3;text-decoration:none}
    .top-menu-link:hover,.top-menu-link:focus-visible,.top-menu-link.active{background:var(--orange);color:#fff;border-color:var(--orange)}
    .social-brand{display:inline-flex;align-items:center;flex:0 0 auto;color:#6b7280;font-size:12px;font-weight:900;letter-spacing:-.04em;white-space:nowrap}
    .social-icon-link{display:inline-flex;align-items:center;justify-content:center;flex:0 0 34px;width:34px;min-height:34px;height:34px;padding:0;border-radius:10px;color:#fff}
    .social-icon-link svg{width:18px;height:18px;display:block}
    .social-icon-link.instagram{background:linear-gradient(135deg,#f58529,#dd2a7b 52%,#8134af)}
    .social-icon-link.blog{background:#03c75a}
    .topbar{background:var(--orange);color:#fff;padding:16px 18px 15px;position:relative;z-index:1}
    .global-nav{display:none}
    .global-nav::-webkit-scrollbar{display:none}
    .global-nav a{flex:0 0 auto;padding:7px 12px;border:1px solid #ffd0b5;border-radius:999px;background:#fff8f3;color:var(--orange-dark);font-size:12px;font-weight:900;text-decoration:none}
    .global-nav a:hover,.global-nav a:focus-visible{background:var(--orange);border-color:var(--orange);color:#fff}
    .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{font-weight:900;font-size:18px;letter-spacing:-.06em;line-height:1.25}
    .subbrand{margin-top:4px;font-size:12px;opacity:.92}
    .top-actions{display:flex;align-items:center;gap:6px;white-space:nowrap}
    .student-name{font-size:12px;font-weight:800}
    .top-button{padding:7px 9px;border:1px solid rgba(255,255,255,.55);border-radius:9px;background:transparent;color:#fff;font-size:11px;font-weight:800}
    .screen{padding:22px 18px 34px}
    .hidden{display:none!important}
    .hero{text-align:center;padding:14px 0 7px}
    .badge{display:inline-flex;padding:6px 10px;border-radius:999px;background:#fff0e6;color:var(--orange-dark);font-size:13px;font-weight:900}
    h1{margin:15px 0 10px;font-size:clamp(27px,6vw,38px);line-height:1.22;letter-spacing:-.075em}
    .hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
    .timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:25px 0 23px;position:relative}
    .timeline:before{content:"";position:absolute;left:12%;right:12%;top:21px;height:2px;background:#ffd4bd}
    .step{position:relative;z-index:1;text-align:center}
    .step-no{display:grid;place-items:center;width:42px;height:42px;margin:0 auto 7px;border:2px solid #ffc39f;border-radius:50%;background:#fff;color:var(--orange-dark);font-weight:900}
    .step-label{font-size:11px;line-height:1.3;font-weight:800;color:#4b5563}
    .info-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0}
    .info-box{padding:14px 7px;border:1px solid var(--line);border-radius:13px;background:#fff;text-align:center}
    .info-box strong{display:block;color:var(--orange-dark);font-size:18px}
    .info-box span{display:block;margin-top:3px;color:var(--muted);font-size:11px}
    .notice{margin:18px 0;padding:14px 15px;border-radius:13px;background:var(--soft);color:#70411e;font-size:13px;line-height:1.55}
    .primary{width:100%;padding:14px 16px;border-radius:12px;background:var(--orange);color:#fff;font-weight:900;font-size:15px;box-shadow:0 8px 18px rgba(243,112,33,.2)}
    .primary:hover,.primary:focus-visible{background:var(--orange-dark)}
    .quiz-head,.review-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .progress-label{color:var(--orange-dark);font-size:14px;font-weight:900}
    .source-label{color:var(--muted);font-size:12px;font-weight:800}
    .progress-track{height:7px;margin-bottom:18px;border-radius:999px;background:#f3e5dd;overflow:hidden}
    .progress-fill{height:100%;border-radius:inherit;background:var(--orange);transition:width .2s ease}
    .question-card,.result-card,.review-card,.complete-card{border:1px solid var(--line);border-radius:18px;background:#fff}
    .question-card{padding:20px 17px}
    .question-number{margin-bottom:11px;color:var(--orange-dark);font-size:13px;font-weight:900}
    .question-text{margin:0;white-space:pre-line;font-size:19px;line-height:1.55;letter-spacing:-.045em}
    .choices{display:grid;gap:10px;margin-top:20px}
    .choice{display:flex;align-items:flex-start;gap:10px;width:100%;padding:13px 12px;border:1px solid #d9dde2;border-radius:12px;background:#fff;color:var(--ink);text-align:left;line-height:1.45}
    .choice:hover,.choice:focus-visible{border-color:#f5a678;background:#fffaf7}
    .choice.selected{border-color:var(--orange);background:#fff3eb;box-shadow:0 0 0 2px #ffe1cd}
    .choice-number{display:grid;place-items:center;flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#f1f3f5;color:#5b6470;font-size:12px;font-weight:900}
    .choice.selected .choice-number{background:var(--orange);color:#fff}
    .choice-text{font-size:14px;white-space:pre-line}
    .quiz-nav,.review-nav{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
    .nav-button{padding:12px 10px;border:1px solid #d9dde2;border-radius:11px;background:#fff;color:#4b5563;font-size:13px;font-weight:900}
    .nav-button:hover:not(:disabled),.nav-button:focus-visible{border-color:#f0a272;color:var(--orange-dark)}
    .nav-button:disabled{opacity:.4}
    .nav-button.next,.nav-button.submit,.nav-button.complete{border-color:var(--orange);background:var(--orange);color:#fff}
    .nav-button.submit,.nav-button.complete{grid-column:1/-1}
    .quit-button{display:block;margin:18px auto 0;padding:5px 8px;background:transparent;color:#9aa1aa;font-size:11px;text-decoration:underline}
    .validation-note{margin:13px 0 0;padding:11px 12px;border-radius:10px;background:#fff4df;color:#8a5a16;font-size:12px;font-weight:700}
    .result-card{padding:21px 17px;text-align:center}
    .result-kicker{margin:0;color:var(--muted);font-size:13px;font-weight:800}
    .score{margin:7px 0 0;color:var(--orange-dark);font-size:42px;font-weight:950;letter-spacing:-.07em}
    .score-sub{margin:3px 0 0;color:var(--muted);font-size:13px}
    .wrong-summary{margin:18px 0 0;padding:14px;border-radius:12px;background:var(--red-bg);color:#7c2222;text-align:left;font-size:13px;line-height:1.55}
    .wrong-summary strong{display:block;margin-bottom:4px;color:var(--red)}
    .review-card{padding:19px 17px}
    .review-choice{position:relative;display:flex;align-items:flex-start;gap:10px;width:100%;margin-top:9px;padding:12px;border:1px solid #d9dde2;border-radius:11px;background:#fff;text-align:left}
    .review-choice.correct{border-color:#8bc99e;background:var(--green-bg);color:#155d2c}
    .review-choice.wrong-selected{border-color:#eba0a0;background:var(--red-bg);color:#8c2424}
    .review-choice-number{display:grid;place-items:center;flex:0 0 25px;width:25px;height:25px;border-radius:50%;background:#eef0f2;color:#5d6670;font-size:12px;font-weight:900}
    .review-choice.correct .review-choice-number{background:var(--green);color:#fff}
    .review-choice.wrong-selected .review-choice-number{background:var(--red);color:#fff}
    .review-choice-text{font-size:14px;line-height:1.45;white-space:pre-line}
    .choice-mark{margin-left:auto;flex:0 0 auto;font-size:11px;font-weight:900}
    .review-status{margin-top:15px;padding:11px 12px;border-radius:10px;background:#f7f8fa;color:#4b5563;font-size:13px;font-weight:800}
    .explanation{margin-top:14px;padding:14px;border-left:4px solid var(--orange);border-radius:0 11px 11px 0;background:#fff8f3}
    .explanation strong{display:block;margin-bottom:6px;color:var(--orange-dark);font-size:13px}
    .explanation span{display:block;white-space:pre-line;color:#4b5563;font-size:13px;line-height:1.6}
    .complete-card{padding:31px 18px;text-align:center}
    .complete-icon{font-size:42px}
    .complete-card h2{margin:12px 0 7px;font-size:25px;letter-spacing:-.06em}
    .complete-card p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
    .footer-note{margin:21px 0 0;color:#a0a6ad;text-align:center;font-size:11px}
    .site-footer{padding:22px 14px 34px;border-top:1px solid var(--line);color:#8a929b;text-align:center;font-size:11px}
    .footer-nav{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 14px;margin-bottom:10px;color:var(--orange-dark);font-weight:900}
    .footer-nav a{color:inherit;text-decoration:none}
    .footer-nav a:hover,.footer-nav a:focus-visible{text-decoration:underline}
    @media(max-width:520px){.screen{padding:20px 14px 30px}.topbar{padding-left:14px;padding-right:14px}.brand{font-size:16px}.subbrand{font-size:11px}.student-name{display:none}.question-text{font-size:18px}.choice-text{font-size:13px}}
    @media(max-width:370px){.timeline{gap:2px}.step-label{font-size:10px}.info-box strong{font-size:16px}.info-box span{font-size:10px}}
    @media(prefers-reduced-motion:reduce){.progress-fill{transition:none}}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-title-row"><div class="site-title">2026 손해보험 자격시험 온라인학습실[8월 개정판]</div></div>
    <nav class="top-menu" aria-label="주요 메뉴">
      <a class="top-menu-link" href="./학습실.html">홈</a>
      <a class="top-menu-link" href="./자격시험안내.html">자격시험 안내</a>
      <a class="top-menu-link" href="./강의목차.html">동영상 강의보기</a>
      <a class="top-menu-link active" href="./index.html" aria-current="page">모의고사 테스트</a></nav>
  </header>
  <div class="app">
    <main>
      <section id="startScreen" class="screen">
        <button id="startButton" class="primary" type="button">80문항 학습시작</button>
      </section>

      <section id="quizScreen" class="screen hidden">
        <div class="quiz-head">
          <span id="quizProgress" class="progress-label"></span>
          <span id="quizSource" class="source-label"></span>
        </div>
        <div class="progress-track" aria-hidden="true"><div id="quizProgressFill" class="progress-fill"></div></div>
        <article class="question-card">
          <div id="quizNumber" class="question-number"></div>
          <h2 id="quizQuestion" class="question-text"></h2>
          <div id="quizChoices" class="choices"></div>
        </article>
        <p id="validationNote" class="validation-note hidden"></p>
        <div class="quiz-nav">
          <button id="prevButton" class="nav-button" type="button">이전 문제</button>
          <button id="nextButton" class="nav-button next" type="button">다음 문제</button>
          <button id="submitButton" class="nav-button submit hidden" type="button">80문제 제출하고 채점</button>
        </div>
        <button id="quitButton" class="quit-button" type="button">학습을 중단하고 처음으로</button>
      </section>

      <section id="resultScreen" class="screen hidden">
        <div class="result-card">
          <p class="result-kicker">80문항 학습 결과</p>
          <div id="scoreText" class="score"></div>
          <p id="scoreSub" class="score-sub"></p>
          <div id="wrongSummary" class="wrong-summary"></div>
          <button id="reviewButton" class="primary" type="button">오답노트 시작</button>
          <button id="resultHomeButton" class="quit-button" type="button">처음으로 돌아가기</button>
        </div>
      </section>

      <section id="reviewScreen" class="screen hidden">
        <div class="review-head">
          <span id="reviewProgress" class="progress-label"></span>
          <span id="reviewSource" class="source-label"></span>
        </div>
        <div class="progress-track" aria-hidden="true"><div id="reviewProgressFill" class="progress-fill"></div></div>
        <article class="review-card">
          <div id="reviewNumber" class="question-number"></div>
          <h2 id="reviewQuestion" class="question-text"></h2>
          <div id="reviewChoices"></div>
          <div id="reviewStatus" class="review-status"></div>
          <div class="explanation"><strong>공식 해설</strong><span id="reviewExplanation"></span></div>
        </article>
        <div class="review-nav">
          <button id="reviewPrevButton" class="nav-button" type="button">이전 오답</button>
          <button id="reviewNextButton" class="nav-button next" type="button">다음 오답</button>
          <button id="reviewCompleteButton" class="nav-button complete hidden" type="button">오답노트 완료</button>
        </div>
      </section>

      <section id="completeScreen" class="screen hidden">
        <div class="complete-card">
          <div class="complete-icon">✓</div>
          <h2>학습이 끝났습니다.</h2>
          <p id="completeText">80문항 풀이와 오답노트 확인을 완료했습니다.</p>
          <button id="completeHomeButton" class="primary" type="button" style="margin-top:22px">처음으로 돌아가기</button>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <nav class="footer-nav" aria-label="하단 공통 메뉴"><a href="./학습실.html">홈</a><a href="./자격시험안내.html">자격시험 안내</a><a href="./강의목차.html">동영상 강의보기</a><a href="./index.html">모의고사 테스트</a></nav>
      개발저작권 @career_educator
    </footer>

  <script>

항 없음","특별이익 제공금지 위반"],"a":4,"e":"1년간 납입보험료 100만원의 10%와 3만원 중 적은 금액을 초과하는 5만원 상당의 골프공을 선물하였으므로 특별이익 제공금지 위반 행위에 해당함"},{"id":"4-20","type":4,"n":15,"sourceN":20,"q":"중고차 매매업자가 중고차 판매과정에서 자동차보험 가입의사가 있는 고객을 대리점에 소개하고 대리점으로부터 일정비율의 수수료를 받은 경우 모집질서와 관련하여 무엇을 위반한 것인가?","c":["특별이익 제공금지 위반","경유처리 금지 위반","자기계약 금지 위반","수수료 부당지급 금지 위반"],"a":4,"e":"보험모집을 할 수 있는 자 외의 자에게 모집을 위탁하여 모집에 관하여 수수료·보수 그 밖의 대가를 지급하는 것은 무자격자 모집위탁 금지 위반 및 수수료 부당지급 금지 위반에 해당함"},{"id":"4-21","type":4,"n":16,"sourceN":21,"q":"보험계약정보를 제3자에게 제공할 수 있는 경우로 알맞은 것은?","c":["보험협회 등에 정보를 제공하는 경우","고객에게 상품 또는 서비스를 판매할 목적으로 사용하는 경우","고객으로부터 서면동의를 받은 경우","중복보험 가입여부를 조회하는 경우"],"a":3,"e":"①, ②, ④의 경우에도 고객으로부터 해당 정보제공에 대해 서면 등의 방법으로 동의를 받아야 함"},{"id":"5-18","type":5,"n":17,"sourceN":18,"q":"다음 중 보험상품 완전판매를 위한 약관의 전달 및 중요한 내용 설명에 대한 내용으로 옳지 않은 것은? [4점]","c":["약관에 기재된 보험상품의 내용, 보상하는 손해, 보상하지 않는 손해 등 약관의 중요한 내용을 설명해야 한다","보험약관은 분량이 많고 이해하기 어려운 보험전문용어로 설명되어 있는 부분들이 많으므로 중요한 내용에 대해 충분히 설명해야 한다","중요한 내용은 일반적으로 보장개시일, 보험금 지급사유, 보험계약의 해지사유, 보험회사의 면책사유 등에 해당하지 않으며 보험금액의 권리·의무에 대한 것이다","약관 전달의 경우 청약서 부본 전달과 달리 전자우편 등 전자적 방법으로 교부할 수 없다"],"a":4,"e":"보험계약자가 동의하는 경우에는 보험약관을 광기록매체, 전자우편 등 전자적 방법으로 교부 또는 수령할 수 있음"},{"id":"5-19","type":5,"n":18,"sourceN":19,"q":"보험안내자료의 필수기재사항에 해당하지 않는 것은?","c":["보험가입에 따른 권리·의무에 관한 주요 사항","보험료 할인이 가능한 신용카드 목록 제공 서비스","해약환급금에 관한 사항","보험상담 및 분쟁의 해결에 관한 사항"],"a":2,"e":"신용카드 목록을 제공하는 서비스는 필수기재사항에 해당하지 않음"},{"id":"5-20","type":5,"n":19,"sourceN":20,"q":"보험업법상 보험계약의 모집질서 위반행위에 대한 설명으로 틀린 것은?","c":["다른 보험회사에 소속되어 있는 모집종사자에게 모집을 위탁하는 것은 위반행위에 해당한다","실제 명의인이 아닌 자의 보험계약을 모집하거나 실제 명의인의 동의가 없는 보험계약을 모집하는 행위를 경유처리라고 한다","다른 모집 종사자의 명의를 이용하여 보험계약을 모집하는 행위시 1천만원 이하의 과태료를 부과한다","보험계약자나 피보험자가 보험상품의 중요한 사항에 대하여 부실한 사항을 보험회사에 알릴 것을 권유하는 것은 위반행위에 해당한다"],"a":2,"e":"경유처리 → 허위·작성계약"},{"id":"5-21","type":5,"n":20,"sourceN":21,"q":"「손해보험 공정경쟁질서유지에 관한 상호협정」에서 금지하고 있는 행위가 아닌 것은?","c":["특별이익 제공","무자격 모집행위","보험계약 인수거절","승환계약"],"a":3,"e":"보험계약의 인수거절은 상호협정에서 금지하고 있는 행위가 아님"},{"id":"6-18","type":6,"n":21,"sourceN":18,"q":"다음 중 청약서 등 자필서명에 대한 설명으로 맞는 것은? [4점]","c":["피보험자가 미성년자인 경우에도 친권자가 대신 자필서명을 할 수 없다","보험계약자 또는 피보험자로부터 직접 서명을 받는 것을 원칙으로 한다","계약자와 피보험자가 다른 경우 계약자가 피보험자를 대리하여 서명할 수 있다","보험설계사는 보험판매 과정의 편의를 위해 보험계약자와 배우자나 가족이 대신 자필서명을 하도록 할 수 있다"],"a":2,"e":"① 미성년자인 경우 친권자가 대신 자필서명할 수 있습니다. ③ 계약자와 피보험자는 직접 서명해야 하며 대리서명은 할 수 없습니다. ④ 배우자나 가족의 대리서명도 허용되지 않습니다."},{"id":"6-19","type":6,"n":22,"sourceN":19,"q":"통신수단을 이용한 보험모집에 대한 설명 중 틀린 것은?","c":["청약자의 신원을 확인할 수 있는 증명자료가 있는 경우에도 자필서명을 받아야 한다","다른 사람의 평온한 생활을 침해하는 방법으로 모집해서는 안 된다","보험계약 체결을 위해 필요한 사항을 질문하고 그에 대한 보험계약자의 답변을 음성녹음하는 등 증거자료를 확보해야 한다","보험계약자가 체결한 계약의 내용을 확인하고자 하는 경우에는 통신수단을 이용할 수 있도록 하여야 한다"],"a":1,"e":"청약자의 신원을 확인할 수 있는 증명자료가 있는 경우 등에는 자필서명을 받지 않을 수 있습니다."},{"id":"6-20","type":6,"n":23,"sourceN":20,"q":"보험모집질서 확립을 통한 보험산업의 공시적 제고 및 보험가입자의 권익보호를 위해 「손해보험 공정경쟁질서유지에 관한 상호협정」을 운영하고 있는 기관은?","c":["보험연구원","보험개발원","손해보험협회","생명보험협회"],"a":3,"e":"손해보험 공정경쟁질서유지에 관한 상호협정을 운영하고 있는 기관은 손해보험협회입니다."},{"id":"6-21","type":6,"n":24,"sourceN":21,"q":"「손해보험 공정경쟁질서유지에 관한 상호협정」에서 무자격 모집행위를 한 경우 부과되는 제재금 최고 한도액은?","c":["3천만원","1천만원","2천만원","5천만원"],"a":1,"e":"무자격 모집행위의 제재금은 최저 10만원에서 최고 3천만원입니다."},{"id":"7-18","type":7,"n":25,"sourceN":18,"q":"보험료정산특별약정서 사용이 가능한 보험계약자의 조건은? [4점]","c":["과거 6개월간 월평균 보험계약건수 25건 이상이고 월평균 보험료가 500만원 이상","과거 6개월간 월평균 보험계약건수 25건 이상이고 월평균 보험료가 600만원 이상","과거 3개월간 월평균 보험계약건수 20건 이상이고 월평균 보험료가 500만원 이상","과거 3개월간 월평균 보험계약건수 25건 이상이고 월평균 보험료가 600만원 이상"],"a":1,"e":"보험료정산특별약정서는 과거 6개월간 월평균 보험계약건수 25건 이상, 월평균 보험료 500만원 이상인 계약자에 한해서 사용 가능함"},{"id":"7-19","type":7,"n":26,"sourceN":19,"q":"모집질서 관련 준수사항에서 특별이익의 제공에 해당하지 않는 것은?","c":["보험계약자나 피보험자를 위한 보험료의 대납","보험계약자나 피보험자가 해당 보험회사로부터 받은 대출금에 대한 이자의 대납","기초서류에서 정한 사유에 근거한 보험료의 할인 또는 수수료의 지급","기초서류에서 정한 보험금액보다 많은 보험금액의 지급"],"a":3,"e":"기초서류에 근거한 보험료의 할인 또는 수수료의 지급은 특별이익 제공에 해당하지 않음"},{"id":"7-20","type":7,"n":27,"sourceN":20,"q":"보험설계사가 준수해야 하는 모집질서 관련 금지사항이 아닌 것은?","c":["자기가 모집한 계약을 타인이 모집한 것으로 처리하는 행위","보험료를 받지 아니하고 영수증을 먼저 선발행하는 행위","자기가 고용하고 있는 자를 보험계약자 또는 피보험자로 하는 보험을 모집하는 행위","모집을 위탁한 보험회사 이외의 보험회사를 위하여 보험을 모집하는 행위"],"a":3,"e":"보험대리점(또는 보험중개사)의 자기계약 금지와 관련된 내용이며 보험설계사에는 적용되지 않음"},{"id":"7-21","type":7,"n":28,"sourceN":21,"q":"장애인차별금지 및 권리구제 등에 관한 법률(이하 「장애인차별금지법」)에 대한 설명으로 틀린 것은?","c":["누구든지 「장애인차별금지법」을 위반하여 타인에게 손해를 가한 자는 그로 인하여 피해를 입은 사람에 대하여 손해배상책임을 진다","국가인권위원회는 피해자의 진정이 없어도 장애인차별금지법 위반행위가 있다고 믿을 만한 상당한 근거가 있고 그 내용이 중대하다고 인정할 때에는 이를 직권으로 조사할 수 있다","장애인차별금지법에서 금지한 차별행위를 행하고 그 행위가 악의적인 것으로 인정되는 경우 법원은 차별한 자에 대하여 3년 이하의 징역 또는 3천만원 이하의 벌금에 처한다","국가인권위원회의 시정명령을 정당한 사유 없이 이행하지 않은 경우 3천만원 이하의 과태료를 부과받을 수 있다"],"a":4,"e":"국가인권위원회 → 법무부 장관"},{"id":"8-18","type":8,"n":29,"sourceN":18,"q":"모집심사 및 상품설명제에 대한 설명으로 맞는 것은? [4점]","c":["모집종사자는 보험계약자에게 제공하는 설명서에 소속, 성명, 주민번호, 주소 등을 기재해야 한다","모집질서를 위반하면 「보험업법」에 따라 1천만원 이하의 과태료가 부과될 수 있다","이미 가입되어 있는 보험계약과 동일한 조건으로 갱신되는 보험계약도 설명의무를 이행하여야 한다","통신수단을 이용한 보험모집의 경우에도 상품설명서는 자필서명을 받아야 한다"],"a":2,"e":"① 소속, 성명, 연락처 등을 기재해야 하며 주민번호, 주소 등은 기재하지 않음 ③ 설명의무를 이행한 계약이 동일한 조건으로 갱신되는 경우 설명한 것으로 봄 ④ 표준상품설명대본을 통해 설명한 내용을 이해했음을 녹취로 확인함"},{"id":"8-19","type":8,"n":30,"sourceN":19,"q":"보험계약자가 컴퓨터통신을 이용하여 체결한 계약을 해지하려는 경우에 보험회사가 확인해야 할 내용으로 틀린 것은?","c":["보험회사가 확인해야 할 내용과 관련이 없다","보험계약자 본인인지 여부","계약체결 전에 통신수단을 이용한 계약체결에 동의하였는지 여부","타인을 위한 보험계약인 경우 피보험자가 동의하였는지 여부"],"a":1,"e":"보험회사가 확인해야 할 내용과 관련 없음"},{"id":"8-20","type":8,"n":31,"sourceN":20,"q":"다음에서 보험계약의 체결 또는 모집에 관한 금지사항에 해당하지 않는 것은?","c":["보험계약자와 대출관계를 이용하여 보험계약을 청약하게 하는 행위","보험상품의 중요한 사항에 대하여 보험회사에 알릴 것을 권유하는 행위","보험계약자에게 보험상품의 중요한 사항을 알리지 않는 행위","보험계약자의 자필서명을 위조하는 행위"],"a":4,"e":"①, ②, ③은 계약체결 또는 모집에 관한 금지사항에 해당함"},{"id":"8-21","type":8,"n":32,"sourceN":21,"q":"다음 보기의 내용은 「손해보험 공정경쟁질서유지에 관한 상호협정」상 어떤 위반행위에 해당하는가?\n\n보험대리점 소속 설계사 김씨는 보험회사 소속 설계사 황씨가 모집한 계약을 자신이\n모집한 것으로 하여 황씨에게 자기가 받은 수당 일부를 지급하였다","c":["승환계약","무자격 모집행위","특별이익 제공","보험계약 경유 처리"],"a":4,"e":"보험계약의 경유 처리 위반에 해당됨"},{"id":"9-18","type":9,"n":33,"sourceN":18,"q":"보험금 청구 단계에서 계약자에게 설명하여야 하는 사항에 해당하지 않는 것은? [4점]","c":["보험금 청구 담당부서 및 연락처","해약환급금의 손실 발생 가능성","보험금 청구에 필요한 서류","보험금 심사 절차"],"a":2,"e":"해약환급금의 손실 발생 가능성은 보험계약 체결 권유 단계에서 설명해야 함" -18","type":11,"n":41,"sourceN":18,"q":"보험계약의 완전판매에 대한 설명으로 옳지 않은 것은? [4점]","c":["모집사실명제를 위반할 경우에는 1천만원 이하의 과태료가 부과된다","전문금융소비자를 대상으로 하는 경우에는 단계별 설명의무가 적용되지 않는다","3대 기본지키기는 청약서 등 자필서명, 청약서 부본 전달, 상품설명서 제공을 말한다","단계별 설명의무로 보험계약 체결 권유 단계에서 해약환급금에 대한 설명을 하여야 한다"],"a":3,"e":"상품설명서 제공 → 약관의 전달 및 중요한 내용 설명"},{"id":"11-19","type":11,"n":42,"sourceN":19,"q":"보험안내자료에 대한 설명으로 틀린 것은?","c":["전문보험계약자가 체결하는 보험계약의 경우에 일반금융소비자와 같이 보험안내자료를 제공하여야 한다","보험계약을 체결하는 경우 계약자 보관용 청약서, 설명서, 약관, 보험증권을 제공하여야 한다","보험안내자료는 보험계약자 특정인에게 제공되는 홍보물을 말하며, 불특정다수에게 제공되는 홍보물은 모집광고로 본다","사업연도 만료일 기준 1년 이상 유지된 계약은 보험계약관리내용을 연 1회 이상 제공하여야 한다"],"a":1,"e":"일반금융소비자에게 보험계약 체결 권유 또는 일반금융소비자가 설명을 요청하는 경우 상품설명서 등을 제공하여야 하나 전문보험계약자가 체결하는 보험계약은 제외함"},{"id":"11-20","type":11,"n":43,"sourceN":20,"q":"대리점이 보험설계사 위촉시 위탁계약서를 작성하지 않았을 경우 처벌은?","c":["100만원 이하 과태료","500만원 이하 과태료","1천만원 이하 과태료","3천만원 이하 과태료"],"a":3,"e":"보험회사 등이 보험설계사에게 보험계약의 모집을 위탁할 때 위탁계약서 미교부, 계약사항 미이행시 1천만원 이하의 과태료를 부과받을 수 있음"},{"id":"11-21","type":11,"n":44,"sourceN":21,"q":"손해보험협회에서 운영하는 장애인 및 장기기증자 보험가입 차별 신고센터에 신고할 수 없는 자는?","c":["장애인","장기기증자","장애인 및 장기기증자의 대리인","보험회사 직원"],"a":4,"e":"신고 주체는 장애인·장기기증자 본인 및 대리인임"},{"id":"12-18","type":12,"n":45,"sourceN":18,"q":"보험계약 체결 권유 단계에서 설명하여야 할 내용으로 옳지 않은 것은? [4점]","c":["보험의 모집에 종사하는 자의 성명·연락처 및 소속","보험금 지급단계시 유의 및 지급절차","보험료 납입기간 및 보험기간","고지의무·통지의무 위반의 효과"],"a":1,"e":"보험계약 체결 단계에서 설명하여야 할 사항임"},{"id":"12-19","type":12,"n":46,"sourceN":19,"q":"보험계약의 체결 또는 모집에 관한 금지행위에 해당하지 않는 것은?","c":["보험상품의 중요한 사항을 보험회사에 알리는 것을 방해하거나 알리지 아니할 것을 권유하는 행위","비교의 대상 및 근거를 분명하게 밝히지 않고 다른 보험상품과 비교하여 유리하다고 알리는 행위","부당한 계약전환을 통해 새로운 계약을 청약하게 하는 행위","제1회 보험료 납입 후 보장이 개시된다고 설명하는 행위"],"a":4,"e":"보험계약자에게 설명해야 하는 사항에 해당함(보장개시일은 약관 설명의무의 중요한 사항에 해당함)"},{"id":"12-20","type":12,"n":47,"sourceN":20,"q":"실제 명의인이 아닌 자의 보험계약을 모집하거나 실제 명의인의 동의가 없는 보험계약을 모집하는 행위의 처벌은?","c":["과태료 5천만원 이하","과태료 3천만원 이하","과태료 2천만원 이하","과태료 1천만원 이하"],"a":4,"e":"보험계약의 체결 또는 모집에 관한 금지행위에 해당하며 「보험업법」에서는 1천만원 이하의 과태료를 부과함"},{"id":"12-21","type":12,"n":48,"sourceN":21,"q":"「 청약서 작성, 초회동의서 징구, 중복가입 확인","초회동의서 징구, 청약서 작성, 중복가입 확인","중복가입 확인, 초회동의서 징구, 청약서 작성"],"a":1,"e":"실손의료보험 판매시 중복가입 확인 및 비례보상 설명을 위한 절차임"},{"id":"19-20","type":19,"n":75,"sourceN":20,"q":"금융상품판매대리·중개업자의 금지행위에 해당하지 않는 것은?","c":["보험설계사가 다른 보험회사·보험대리점에 소속된 다른 보험설계사와 위탁계약을 체결한 경우","보험중개사가 소속 보험설계사와 위탁계약을 체결한 경우","보험설계사가 같은 보험회사·보험대리점 또는 보험중개사에 소속된 다른 보험설계사와 위탁계약을 체결한 경우","보험대리점이 같은 보험회사의 다른 보험대리점과 위탁계약을 체결하면서 금융상품직접판매업자로부터 그 계약내용에 대해 사전동의를 받지 않은 경우"],"a":3,"e":"①, ②는 금지행위에 해당하고, ④는 사전동의를 받아야 함"},{"id":"19-21","type":19,"n":76,"sourceN":21,"q":"다음 보기의 (   ) 안에 들어갈 단어는?","c":["철회","취소","수정","가감"],"a":1,"e":"「개인신용정보의 제공동의」 철회에 대한 설명임"},{"id":"20-18","type":20,"n":77,"sourceN":18,"q":"보험회사 또는 보험설계사 등이 \u0027약관의 전달 및 중요한 내용 설명\u0027을 위반한 경우, 보험계약자가 계약체결 이후 계약을 취소할 수 있는 기간으로 알맞은 것은? [4점]","c":["1개월 이내","2개월 이내","3개월 이내","5개월 이내"],"a":3,"e":"계약체결 이후 3개월 이내에 계약 취소 가능"},{"id":"20-19","type":20,"n":78,"sourceN":19,"q":"보험안내자료에 대한 설명으로 틀린 것은?","c":["보험안내자료는 불특정다수에게 제공되는 홍보물이다","모집광고의 광고 관련 준수사항 등은 「금융소비자보호에 관한 법률」의 적용을 받는다","보험안내자료의 필수기재사항 등은 「보험업법」의 적용을 받는다","전문보험계약자를 대상으로 하는 보험계약은 보험계약관리내용을 제공하지 않아도 된다"],"a":1,"e":"보험안내자료는 보험계약자, 보험금을 수령하는 자 등에게 제공되는 홍보물이고 불특정다수에게 제공되는 홍보물은 모집광고로 봄"},{"id":"20-20","type":20,"n":79,"sourceN":20,"q":"「금소법」상 부당권유행위 금지 위반시 부과되는 과태료는 얼마인가?","c":["1억원","5천만원","3천만원","1천만원"],"a":1,"e":"「금소법」의 부당권유행위 금지 위반시 1억원 이하의 과태료를 부과함"},{"id":"20-21","type":20,"n":80,"sourceN":21,"q":"보험대리점 지점장인 김풍금씨가 인터넷으로 보험상품을 판매하면서 태아보험 가입시 50만원 상당의 유모차를 지급한다는 광고를 게재했다면 이는 「손해보험 공정경쟁질서유지에 관한 상호협정」에서 금지하고 있는 무슨 행위에 해당하는가?","c":["투자적 모집행위","특별이익 제공","보험계약 강요처리","특별이익 제공 약속"],"a":4,"e":"50만원은 최초 1년간 납입보험료의 100분의 10과 3만원 중 적은 것보다 많은 금액이므로 특별이익 제공을 약속한 금지행위임"}]; var questionBank = questions;
    var totalQuestions = questionBank.length;
    var answers = Array(totalQuestions).fill(null);
    var cursor = 0;
    var wrongItems = [];
    var reviewCursor = 0;

    function $(id) { return document.getElementById(id); }
    function displayText(value) {
      return String(value == null ? '' : value).replace(/\\n/g, '\n');
    }
    function showScreen(id) {
      ['startScreen','quizScreen','resultScreen','reviewScreen','completeScreen'].forEach(function (screenId) {
        $(screenId).classList.toggle('hidden', screenId !== id);
      });
      window.scrollTo(0, 0);
    }
    function sourceText(item) {
      return item.type + '형 ' + item.sourceN + '번';
    }
    function resetStudy() {
      answers = Array(totalQuestions).fill(null);
      cursor = 0;
      wrongItems = [];
      reviewCursor = 0;
      showScreen('startScreen');
    }
    function renderQuiz() {
      var item = questionBank[cursor];
      $('quizProgress').textContent = (cursor + 1) + ' / ' + totalQuestions;
      $('quizSource').textContent = sourceText(item);
      $('quizProgressFill').style.width = (((cursor + 1) / totalQuestions) * 100) + '%';
      $('quizNumber').textContent = '문항 ' + (cursor + 1) + ' · ' + sourceText(item);
      $('quizQuestion').textContent = displayText(item.q);
      $('quizChoices').innerHTML = '';

      item.c.forEach(function (choice, index) {
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'choice' + (answers[cursor] === index + 1 ? ' selected' : '');
        var number = document.createElement('span');
        number.className = 'choice-number';
        number.textContent = index + 1;
        var text = document.createElement('span');
        text.className = 'choice-text';
        text.textContent = displayText(choice);
        button.append(number, text);
        button.addEventListener('click', function () {
          answers[cursor] = index + 1;
          $('validationNote').classList.add('hidden');
          renderQuiz();
        });
        $('quizChoices').appendChild(button);
      });

      $('prevButton').disabled = cursor === 0;
      $('nextButton').classList.toggle('hidden', cursor === totalQuestions - 1);
      $('submitButton').classList.toggle('hidden', cursor !== totalQuestions - 1);
    }
    function beginStudy() {
      answers = Array(totalQuestions).fill(null);
      cursor = 0;
      wrongItems = [];
      showScreen('quizScreen');
      renderQuiz();
    }
    function submitStudy() {
      var missing = answers.findIndex(function (answer) { return answer == null; });
      if (missing !== -1) {
        cursor = missing;
        $('validationNote').textContent = '아직 답하지 않은 문항이 있습니다. 현재 문항부터 답해 주세요.';
        $('validationNote').classList.remove('hidden');
        renderQuiz();
        return;
      }

      wrongItems = [];
      questionBank.forEach(function (item, index) {
        if (answers[index] !== item.a) {
          wrongItems.push({ item: item, selected: answers[index] });
        }
      });

      var correctCount = totalQuestions - wrongItems.length;
      $('scoreText').textContent = correctCount + ' / ' + totalQuestions;
      $('scoreSub').textContent = '정답률 ' + Math.round(correctCount / totalQuestions * 100) + '% · 오답 ' + wrongItems.length + '문항';

      if (wrongItems.length) {
        $('wrongSummary').innerHTML = '<strong>오답 문항</strong>' + wrongItems.map(function (entry) {
          return sourceText(entry.item);
        }).join(', ');
        $('reviewButton').textContent = '오답노트 시작 (' + wrongItems.length + '문항)';
        $('reviewButton').classList.remove('hidden');
      } else {
        $('wrongSummary').innerHTML = '<strong>전 문항 정답</strong>틀린 문제가 없어 오답노트를 생략합니다.';
        $('reviewButton').classList.add('hidden');
      }
      showScreen('resultScreen');
    }
    function renderReview() {
      var entry = wrongItems[reviewCursor];
      var item = entry.item;
      $('reviewProgress').textContent = '오답 ' + (reviewCursor + 1) + ' / ' + wrongItems.length;
      $('reviewSource').textContent = sourceText(item);
      $('reviewProgressFill').style.width = (((reviewCursor + 1) / wrongItems.length) * 100) + '%';
      $('reviewNumber').textContent = '문항 ' + sourceText(item);
      $('reviewQuestion').textContent = displayText(item.q);
      $('reviewChoices').innerHTML = '';

      item.c.forEach(function (choice, index) {
        var choiceNo = index + 1;
        var isCorrect = choiceNo === item.a;
        var isSelected = choiceNo === entry.selected;
        var button = document.createElement('div');
        button.className = 'review-choice' + (isCorrect ? ' correct' : '') + (isSelected ? ' wrong-selected' : '');
        var number = document.createElement('span');
        number.className = 'review-choice-number';
        number.textContent = choiceNo;
        var text = document.createElement('span');
        text.className = 'review-choice-text';
        text.textContent = displayText(choice);
        var mark = document.createElement('span');
        mark.className = 'choice-mark';
        mark.textContent = isCorrect ? '정답' : (isSelected ? '내 답' : '');
        button.append(number, text, mark);
        $('reviewChoices').appendChild(button);
      });

      $('reviewStatus').textContent = '내가 고른 답: ' + entry.selected + '번 · 정답: ' + item.a + '번';
      $('reviewExplanation').textContent = displayText(item.e);
      $('reviewPrevButton').disabled = reviewCursor === 0;
      $('reviewNextButton').classList.toggle('hidden', reviewCursor === wrongItems.length - 1);
      $('reviewCompleteButton').classList.toggle('hidden', reviewCursor !== wrongItems.length - 1);
    }
    function beginReview() {
      reviewCursor = 0;
      showScreen('reviewScreen');
      renderReview();
    }
    function finishStudy() {
      $('completeText').textContent = '80문항 풀이와 ' + wrongItems.length + '개 오답의 해설 확인을 완료했습니다.';
      showScreen('completeScreen');
    }

    $('startButton').addEventListener('click', beginStudy);
    $('prevButton').addEventListener('click', function () {
      if (cursor > 0) { cursor -= 1; renderQuiz(); }
    });
    $('nextButton').addEventListener('click', function () {
      if (cursor < totalQuestions - 1) { cursor += 1; renderQuiz(); }
    });
    $('submitButton').addEventListener('click', submitStudy);
    $('reviewButton').addEventListener('click', beginReview);
    $('reviewPrevButton').addEventListener('click', function () {
      if (reviewCursor > 0) { reviewCursor -= 1; renderReview(); }
    });
    $('reviewNextButton').addEventListener('click', function () {
      if (reviewCursor < wrongItems.length - 1) { reviewCursor += 1; renderReview(); }
    });
    $('reviewCompleteButton').addEventListener('click', finishStudy);
    function goFocusMenu(confirmFirst) {
      if (confirmFirst && !confirm('현재 학습을 중단하고 모의고사 테스트 목록으로 돌아갈까요?')) return;
      window.location.href = './index.html';
    }
    $('quitButton').addEventListener('click', function () {
      goFocusMenu(true);
    });
    $('resultHomeButton').addEventListener('click', function () { goFocusMenu(false); });
    $('completeHomeButton').addEventListener('click', function () { goFocusMenu(false); });

  </script>
</body>
</html>
