<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#334155">
  <title>온라인학습실 관리자</title>
  <style>
    :root{--ink:#17202a;--muted:#64748b;--line:#dbe5ec;--bg:#f5f7fa;--card:#fff;--navy:#334155;--blue:#2563eb;--red:#b42318;--green:#087443;--shadow:0 14px 34px rgba(30,41,59,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5}header{background:var(--navy);color:#fff;padding:20px 18px}.header-inner,main{width:min(100% - 28px,1040px);margin:0 auto}.title{font-size:clamp(17px,4vw,23px);font-weight:900;letter-spacing:-.06em}.sub{margin:4px 0 0;color:#d6dee8;font-size:12px}.login-wrap{width:min(100% - 28px,420px);margin:50px auto}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow)}h1,h2{margin:0;letter-spacing:-.05em}h1{font-size:25px}h2{font-size:19px}.intro{color:var(--muted);font-size:13px;margin:9px 0 20px}label{display:block;margin:13px 0 6px;font-size:13px;font-weight:800}.field{width:100%;height:45px;border:1px solid #cbd5e1;border-radius:9px;padding:0 11px;font:inherit}.button{height:45px;border:0;border-radius:9px;background:var(--navy);color:#fff;font:inherit;font-weight:900;cursor:pointer}.full{width:100%;margin-top:18px}.message{min-height:20px;margin:10px 0 0;color:var(--red);font-size:12px;font-weight:800}.admin-main{padding:28px 0 55px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}.small-button{border:1px solid #cbd5e1;border-radius:8px;padding:8px 11px;background:#fff;color:var(--navy);font:inherit;font-size:12px;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:380px minmax(0,1fr);gap:18px;align-items:start}.section{margin-bottom:18px}.section h2{margin-bottom:14px}.save{background:var(--blue)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;min-width:650px;border-collapse:collapse;background:#fff;font-size:12px}.table th,.table td{padding:10px 9px;border-bottom:1px solid #edf1f4;text-align:left;white-space:nowrap}.table th{background:#f1f5f9;color:#475569;font-weight:900}.status-active{color:var(--green);font-weight:900}.status-disabled{color:var(--red);font-weight:900}.empty{padding:24px;text-align:center;color:var(--muted);font-size:13px}.note{margin:10px 0 0;color:var(--muted);font-size:12px}footer{padding:20px;text-align:center;color:#7d8993;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}.login-wrap{margin-top:28px}}
  </style>
</head>
<body>
  <header><div class="header-inner"><div class="title">온라인학습실 관리자</div><p class="sub">운영 일정과 수강생 이용 상태를 관리합니다.</p></div></header>
  <section id="adminLogin" class="login-wrap"><div class="card"><h1>관리자 로그인</h1><p class="intro">관리자 비밀번호 6자리를 입력하세요.</p><form id="adminForm"><input id="adminPassword" class="field" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="6자리 비밀번호" required><button class="button full" type="submit">관리자 화면 입장</button><p id="adminMessage" class="message"></p></form></div></section>
  <main id="adminPanel" class="admin-main" hidden><div class="toolbar"><div><h1>운영 관리</h1><p class="note">저장 후 수강생 로그인에 즉시 반영됩니다.</p></div><button id="refresh" class="small-button">새로고침</button></div><div class="grid"><div><section class="card section"><h2>운영 일정 설정</h2><form id="settingsForm"><label for="month">운영월</label><input id="month" class="field" type="month" required><label for="start">개강일</label><input id="start" class="field" type="date" required><label for="exam">시험일</label><input id="exam" class="field" type="date" required><label for="end">이용종료일</label><input id="end" class="field" type="date" required><label for="code">월별 인증코드 4자리</label><input id="code" class="field" type="text" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required><label for="memo">메모</label><input id="memo" class="field" type="text"><button class="button full save" type="submit">운영 일정 저장</button><p id="settingsMessage" class="message"></p></form></section><section class="card section"><h2>수강생 추가</h2><form id="studentForm"><label for="studentMonth">운영월</label><input id="studentMonth" class="field" type="month" required><label for="studentName">이름</label><input id="studentName" class="field" type="text" required><label for="studentPhone">연락처 뒤 4자리</label><input id="studentPhone" class="field" type="text" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required><button class="button full" type="submit">수강생 등록</button><p id="studentMessage" class="message"></p></form></section></div><section class="card"><div class="toolbar"><h2>수강생 목록</h2><span id="count" class="note"></span></div><div id="studentTable" class="table-wrap"><div class="empty">데이터를 불러오는 중입니다.</div></div></section></div></main>
  <footer>개발저작권 @career_educator</footer>
  <script src="./인증설정.js"></script>
  <script>
    (function(){
      var token = '';
      var loginBox = document.getElementById('adminLogin'), panel = document.getElementById('adminPanel');
      var adminMessage = document.getElementById('adminMessage');
      var now = new Date(), defaultMonth = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
      document.getElementById('month').value = defaultMonth; document.getElementById('studentMonth').value = defaultMonth;
      function setMessage(id, text){ document.getElementById(id).textContent = text || ''; }
      function fillSettings(settings){
        var current = settings.filter(function(item){return item.month === document.getElementById('month').value;})[0] || settings[settings.length-1];
        if (!current) return;
        document.getElementById('month').value = current.month; document.getElementById('studentMonth').value = current.month; document.getElementById('start').value = current.startDate; document.getElementById('exam').value = current.examDate; document.getElementById('end').value = current.endDate; document.getElementById('memo').value = current.memo || '';
      }
      function renderStudents(students){
        document.getElementById('count').textContent = students.length + '명';
        if (!students.length) { document.getElementById('studentTable').innerHTML = '<div class="empty">등록된 수강생이 없습니다.</div>'; return; }
        var rows = students.map(function(item){ var active = item.active === '활성'; return '<tr><td>'+item.month+'</td><td>'+item.name+'</td><td>'+item.phone+'</td><td class="'+(active?'status-active':'status-disabled')+'">'+item.active+'</td><td>'+item.registered+'</td><td><button class="small-button status-button" data-row="'+item.rowNumber+'" data-status="'+(active?'비활성':'활성')+'">'+(active?'이용 중지':'이용 재개')+'</button></td></tr>'; }).join('');
        document.getElementById('studentTable').innerHTML = '<table class="table"><thead><tr><th>운영월</th><th>이름</th><th>연락처</th><th>상태</th><th>등록일</th><th>변경</th></tr></thead><tbody>'+rows+'</tbody></table>';
        document.querySelectorAll('.status-button').forEach(function(button){button.addEventListener('click',function(){button.disabled=true; window.LearningAuth.setStatus(token,button.dataset.row,button.dataset.status).then(function(result){if(!result.ok){alert(result.error);button.disabled=false;return;}loadData();});});});
      }
      function loadData(){ window.LearningAuth.adminData(token).then(function(result){ if(!result.ok){adminMessage.textContent=result.error;return;} fillSettings(result.settings); renderStudents(result.students); }).catch(function(error){adminMessage.textContent=error.message;}); }
      document.getElementById('adminForm').addEventListener('submit',function(event){event.preventDefault(); adminMessage.textContent='확인 중입니다.'; window.LearningAuth.adminLogin(document.getElementById('adminPassword').value).then(function(result){if(!result.ok){adminMessage.textContent=result.error;return;} token=result.token; loginBox.hidden=true; panel.hidden=false; loadData();}).catch(function(error){adminMessage.textContent=error.message;});});
      document.getElementById('settingsForm').addEventListener('submit',function(event){event.preventDefault(); setMessage('settingsMessage','저장 중입니다.'); window.LearningAuth.saveSettings(token,{month:document.getElementById('month').value,start:document.getElementById('start').value,exam:document.getElementById('exam').value,end:document.getElementById('end').value,code:document.getElementById('code').value,memo:document.getElementById('memo').value}).then(function(result){setMessage('settingsMessage',result.ok?'저장되었습니다.':result.error);if(result.ok)loadData();}).catch(function(error){setMessage('settingsMessage',error.message);});});
      document.getElementById('studentForm').addEventListener('submit',function(event){event.preventDefault(); setMessage('studentMessage','등록 중입니다.'); window.LearningAuth.addStudent(token,{month:document.getElementById('studentMonth').value,name:document.getElementById('studentName').value,phone:document.getElementById('studentPhone').value}).then(function(result){setMessage('studentMessage',result.ok?'등록되었습니다.':result.error);if(result.ok){document.getElementById('studentName').value='';document.getElementById('studentPhone').value='';loadData();}}).catch(function(error){setMessage('studentMessage',error.message);});});
      document.getElementById('refresh').addEventListener('click',loadData);
    }());
  </script>
</body>
</html>
