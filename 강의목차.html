    .top-menu-link:hover,.top-menu-link:focus-visible{background:var(--orange);color:#fff;border-color:var(--orange)}
    .top-menu-link.active{background:var(--orange);border-color:var(--orange);color:#fff}
    .page-shell{width:min(760px,calc(100% - 32px));margin:0 auto;padding:116px 0 34px}
    .hero{text-align:left;padding:48px 0 34px;margin:0 0 20px;background:linear-gradient(135deg,#fff 0%,#eff6ff 100%);border-bottom:1px solid #dbeafe}

    .eyebrow::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--orange)}
    h1{margin:0;font-size:clamp(28px,5vw,46px);line-height:1.15;letter-spacing:-.055em}
    .lead{margin:16px 0 0;max-width:650px;color:#4b5563;font-size:16px;line-height:1.5}
    .summary{display:flex;justify-content:flex-start;flex-wrap:wrap;gap:9px;margin-top:23px}
    .summary span{padding:8px 12px;border-radius:999px;background:#fff;border:1px solid #bfdbfe;color:#1e40af;font-size:13px;font-weight:700;box-shadow:var(--shadow)}
    .part-list{display:grid;gap:12px}
    .part-card{border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
    .part-card>summary{list-style:none;cursor:pointer}
    .part-card>summary::-webkit-details-marker,.lecture-group>summary::-webkit-details-marker{display:none}
    .part-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 18px}
    .part-summary::after{content:"⌄";flex:0 0 auto;color:var(--orange-dark);font-size:20px;font-weight:900;line-height:1}
    .part-card[open]>.part-summary::after{content:"⌃"}
    .part-kicker{display:block;margin-bottom:3px;color:var(--orange-dark);font-size:11px;font-weight:900;letter-spacing:.04em}
    .part-name{display:block;font-size:18px;font-weight:900;letter-spacing:-.045em}
    .part-total{flex:0 0 auto;color:var(--muted);font-size:12px;font-weight:800;text-align:right}
    .part-body{padding:0 12px 13px;border-top:1px solid #f0f1f3}
    .lecture-group{margin-top:10px;border:1px solid #dbeafe;border-radius:14px;overflow:hidden;background:#fff}
    .lecture-group>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;list-style:none;cursor:pointer;padding:13px 14px;background:#f5f9ff}
    .lecture-group>summary::before{content:"+";display:grid;place-items:center;width:22px;height:22px;border-radius:7px;background:#dbeafe;color:var(--orange-dark);font-size:16px;font-weight:900}
    .lecture-group[open]>summary::before{content:"−"}
    .group-title{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
    .group-title strong{font-size:14px;line-height:1.35;letter-spacing:-.035em}
    .group-meta{flex:0 0 auto;color:var(--muted);font-size:11px;font-weight:800;text-align:right}
    .lecture-list{display:grid;gap:8px;padding:10px}
    .lecture-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid #eceef1;border-radius:12px;background:#fff;transition:border-color .15s,background .15s}
    .lecture-row.is-viewed{border-color:#a9d9b6;background:var(--green-bg)}
    .lecture-copy{min-width:0}
    .lecture-range{display:block;margin-bottom:4px;color:var(--orange-dark);font-size:11px;font-weight:900}

    .lecture-title{display:block;font-size:14px;font-weight:800;line-height:1.4;letter-spacing:-.035em;overflow-wrap:anywhere}

    .watch-link{display:flex;flex:0 0 auto;flex-direction:column;align-items:flex-end;gap:6px}

        {title:'손해보험 법규와 약관',total:'2편 · 1시간 00분 16초',range:'30~33번',videos:[
          {id:'p2-01',title:'손해보험 법규와 약관 1',duration:'29:13',url:'https://youtu.be/p1DKRY2CbKw?si=hBvOYlf9ODyBzc8'},
          {id:'p2-02',title:'손해보험 법규와 약관 2',duration:'31:03',url:'https://youtu.be/oAGTg6dM640?si=iXpjrPCgDRhPDyhL'}]},
        {title:'모집질서 관련 법규',total:'2편 · 34분 57초',range:'18~21번',videos:[
          {id:'p2-03',title:'모집질서 관련 법규 1',duration:'14:34',url:'https://youtu.be/-wlKLPxKicc?si=xPI7Met78bw6r1nt'},
          {id:'p2-04',title:'모집질서 관련 법규 2',duration:'20:23',url:'https://youtu.be/Co8HY8bD-hY?si=KsyPMQV85Oa8mlIP'}]}]},
      {kicker:'PART 3',name:'손해보험',total:'13편 · 2시간 58분 24초',groups:[
        {title:'손해보험 개요 및 화재보험의 이해',total:'3편 · 38분 54초',range:'1~3번',videos:[
          {id:'p3-01',title:'손해보험 개요 및 화재보험의 이해 1',duration:'13:52',url:'https://youtu.be/YDxg3utVFmg?si=luDOU15JNMSqQkrp'},
          {id:'p3-02',title:'화재보험의 이해 2',duration:'15:58',url:'https://youtu.be/Eeu5Yx2Ti_w?si=OrhGsPKJv3QRxa5p'},
          {id:'p3-03',title:'화재보험의 이해 3',duration:'9:04',url:'https://youtu.be/tqeKPraUnxY?si=E9spp-X88wCNxtw7'}]},
        {title:'특종보험의 이해',total:'2편 · 18분 07초',range:'4~5번',videos:[
          {id:'p3-04',title:'특종보험의 이해 1',duration:'6:42',url:'https://youtu.be/QDYBq4rjCHA?si=SFq6DytrhAIbso3H'},
          {id:'p3-05',title:'특종보험의 이해 2',duration:'11:25',url:'https://youtu.be/ng5A_fqGcU0?si=G0WZErVqh79cYixZ'}]},
        {title:'장기손해보험의 이해',total:'2편 · 31분 43초',range:'6~10번',videos:[
          {id:'p3-06',title:'장기손해보험의 이해 1',duration:'16:45',url:'https://youtu.be/dVhyrPROwT0?si=dSzgdCP76OpttQUQ'},
          {id:'p3-07',title:'장기손해보험의 이해 2',duration:'14:58',url:'https://youtu.be/uNtcO9V4g58?si=4_ByaW94tnu-wgk8'}]},
        {title:'연금저축보험의 이해',total:'10:59',range:'11~12번',videos:[{id:'p3-08',title:'연금저축보험의 이해',duration:'10:59',url:'https://youtu.be/uNYUs6hKok8?si=Bm9NFsqANs7SqNkK'}]},
        {title:'자동차보험의 이해',total:'5편 · 1시간 18분 41초',range:'13~17번',videos:[
          {id:'p3-09',title:'자동차보험의 이해 1',duration:'19:27',url:'https://youtu.be/6Afoh_N5oR8?si=gA-zOwyXt_q0t1JF'},
          {id:'p3-10',title:'자동차보험의 이해 2',duration:'17:21',url:'https://youtu.be/8tDAyiWUKkI?si=fnemrBxHLPMakt_b'},
          {id:'p3-11',title:'자동차보험의 이해 3',duration:'14:14',url:'https://youtu.be/37y62TNZdw4?si=wRUH3ISWDJr_NzbQ'},
          {id:'p3-12',title:'자동차보험의 이해 4',duration:'15:44',url:'https://youtu.be/HzNKkZkV1oA?si=Q1wCKIc-7sIfgWDv'},
          {id:'p3-13',title:'자동차보험의 이해 5',duration:'11:55',url:'https://youtu.be/9rZkcDwfURE?si=HDZ6P_HX3Hktgg8K'}]}]},
      {kicker:'PART 4',name:'제3보험',total:'5편 · 1시간 02분 31초',groups:[
        {title:'제3보험의 개요 및 상해보험의 이해',total:'3편 · 37분 36초',range:'34~38번',videos:[
          {id:'p4-01',title:'제3보험의 개요 및 상해보험의 이해 1',duration:'20:35',url:'https://youtu.be/x97LYRUdrPA?si=QA7TBw9a2UWHcPKL'},
          {id:'p4-02',title:'상해보험의 이해 2',duration:'10:03',url:'https://youtu.be/rLZZgJbRPdE?si=fa5GQuLZnAabwn3C'},
          {id:'p4-03',title:'상해보험의 이해 3',duration:'6:58',url:'https://youtu.be/TsTNXSTdEBw?si=CtVkUGX0ZHCA9BqO'}]},
        {title:'질병보험의 이해 및 간병보험의 이해',total:'2편 · 24분 55초',range:'44~47번',videos:[
          {id:'p4-04',title:'질병보험의 이해 1',duration:'10:41',url:'https://youtu.be/WE-emYqVRu0?si=MlXz3IlwPqbrvPdW'},
          {id:'p4-05',title:'질병보험의 이해 2 & 간병보험의 이해',duration:'14:14',url:'https://youtu.be/AjgyGSDAJac?si=bt3fGD4OEK8Pq7Q3'}]}]},
      {kicker:'PART 5',name:'실손의료보험',total:'2편 · 28분 53초',groups:[
        {title:'실손의료보험의 이해',total:'2편 · 28분 53초',range:'48~50번',videos:[
          {id:'p5-01',title:'실손의료보험의 이해 1',duration:'19:52',url:'https://youtu.be/JUwJHJd-j2Y?si=k1NP3EUYucuR3ATA'},
          {id:'p5-02',title:'실손의료보험의 이해 2',duration:'9:01',url:'https://youtu.be/N0DsIk0u7GM?si=CyIZ73O11rhh7O2q'}]}]}
    ];

    const VIEWED_KEY = 'insuranceLectureViewed_v1';
    let viewed = new Set();
    try {
      const saved = JSON.parse(localStorage.getItem(VIEWED_KEY) || '[]');
      if (Array.isArray(saved)) viewed = new Set(saved);
    } catch (error) {}

    function esc(value) {
      return String(value).replace(/[&<>"']/g, function(ch) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
      });
    }

    function lectureRow(video, range) {
      return '<div class="lecture-row" data-lecture-id="' + esc(video.id) + '">' +
        '<div class="lecture-copy"><span class="lecture-range">' + esc(range) + '</span><strong class="lecture-title">' + esc(video.title) + '</strong><span class="lecture-duration">' + esc(video.duration) + '</span></div>' +
        '<a class="watch-link" href="' + esc(video.url) + '" target="_blank" rel="noopener noreferrer" onclick="markViewed(\'' + esc(video.id) + '\')"><span class="watch-button">강의 시청</span><span class="view-state">아직 안 열어본 영상</span></a>' +
      '</div>';
    }

    function groupMarkup(group) {
      const rows = group.videos.map(function(video, index) {
        return lectureRow(video, index === 0 ? '출제범위 ' + group.range : '');
      }).join('');
      if (group.videos.length === 1) return '<div class="single-lecture">' + rows + '</div>';
      return '<details class="lecture-group"><summary><span class="group-title"><strong>' + esc(group.title) + '</strong></span><span class="group-meta">' + esc(group.videos.length + '편 · ' + group.total) + '</span></summary><div class="lecture-list">' + rows + '</div></details>';
    }

    function partMarkup(part, index) {
      return '<details class="part-card"' + (index === 0 ? ' open' : '') + '><summary class="part-summary"><span><span class="part-kicker">' + esc(part.kicker) + '</span><span class="part-name">' + esc(part.name) + '</span></span><span class="part-total">' + esc(part.total) + '</span></summary><div class="part-body">' + part.groups.map(groupMarkup).join('') + '</div></details>';
    }

    document.getElementById('partList').innerHTML = parts.map(partMarkup).join('');

    function markViewed(id) {
      viewed.add(id);
      try { localStorage.setItem(VIEWED_KEY, JSON.stringify([...viewed])); } catch (error) {}
      renderViewed();
    }

    function renderViewed() {
      document.querySelectorAll('[data-lecture-id]').forEach(function(row) {
        const seen = viewed.has(row.dataset.lectureId);
        row.classList.toggle('is-viewed', seen);
        const state = row.querySelector('.view-state');
        if (state) state.textContent = seen ? '열어본 영상' : '아직 안 열어본 영상';
      });
    }

    renderViewed();
  </script>
